apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  labels:
    app: my-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-web-app
  template:
    metadata:
      labels:
        app: my-web-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: my-web-app
        image: nginx
        imagePullPolicy: "Always"
        
